[package]
name = "rs-music-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
directories = "6"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
flate2 = "1"
hex = "0.4"
md-5 = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
rquickjs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "wav"] }
tempfile = "3"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
