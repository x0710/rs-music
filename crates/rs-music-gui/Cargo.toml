[package]
name = "rs-music-gui"
version.workspace = true
license.workspace = true
edition = "2024"
repository.workspace = true

[dependencies]
ab_glyph = "0.2"
rs-music-core = { path = "../rs-music-core" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.16.1"
rodio = "0.21.1"
rs-music-storage = { path = "../rs-music-storage" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
zbus = "5"
